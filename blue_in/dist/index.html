<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="기술로 연결되는 커리어. 현장 전문가를 위한 프로필, 채용, 맞춤 매칭 서비스 블루인.">
  <title>블루인 · 기술로 연결되는 커리어</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23265ee8'/%3E%3Ctext x='8' y='30' font-family='Arial' font-weight='bold' font-size='29' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <a class="brand" href="#home" aria-label="블루인 홈">blue<span>in</span><i></i></a>
    <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="직무, 기술, 기업을 검색해 보세요" aria-label="채용 검색"><kbd>⌕</kbd></label>
    <nav class="main-nav" aria-label="주 메뉴">
      <button data-view="home" class="active"><span data-icon="home"></span><span>홈</span></button>
      <button data-view="jobs"><span data-icon="briefcase"></span><span>채용</span></button>
      <button data-view="match"><span data-icon="sparkles"></span><span>AI 매칭</span></button>
      <button data-view="community"><span data-icon="users"></span><span>현장 이야기</span></button>
    </nav>
    <button class="top-profile" data-action="profile" aria-label="내 프로필 수정">민</button>
    <button class="business-link" data-view="employer">기업 서비스 <span>↗</span></button>
  </div></header>
  <nav class="mobile-shortcuts" aria-label="모바일 내 커리어"><button data-view="saved">저장한 채용</button><button data-view="applications">지원 내역</button><button data-view="employer">기업 채용 등록 ↗</button></nav>
  <div class="page-shell">
    <aside class="left-column" id="sidebar"></aside>
    <main id="main" tabindex="-1"></main>
    <aside class="right-column" id="rightbar"></aside>
  </div>
  <footer class="mobile-footer">bluein · 현장의 기술이 기회가 되는 곳</footer>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
